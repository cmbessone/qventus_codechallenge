[tool.poetry]
name = "partsapi"  
version = "0.1.0"
description = "FastAPI service for managing parts inventory"
authors = ["Cristian M. Bessone <cristianbessone@email.com>"]
readme = "README.md"
packages = [
    { include = "app" }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = ">=0.115.12,<0.116.0"
sqlalchemy = ">=2.0.40,<3.0.0"
pydantic = ">=2.11.3,<3.0.0"
uvicorn = ">=0.34.2,<0.35.0"
black = ">=25.1.0,<26.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
httpx = "^0.28.1"
pytest-mock = "^3.14.0"
flake8 = "^7.0.0"

[tool.poetry.scripts]
preload-data = "scripts.preload_data:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.flake8]
max-line-length = 88
extend-ignore = "E203"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
]
