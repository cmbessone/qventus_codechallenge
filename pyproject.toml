[tool.poetry]
name = "partsapi"  
version = "0.1.0"
description = ""
authors = ["Cristian M. Bessone <cristianbessone@email.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13"
fastapi = ">=0.115.12,<0.116.0"
sqlalchemy = ">=2.0.40,<3.0.0"
pydantic = ">=2.11.3,<3.0.0"
uvicorn = ">=0.34.2,<0.35.0"
black = ">=25.1.0,<26.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
httpx = "^0.28.1"
pytest-mock = "^3.14.0"

[tool.poetry.scripts]
preload-data = "scripts.preload_data:main"

[tool.pytest.ini_options]
pythonpath = ["."]
